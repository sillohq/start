[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sillo-start"
version = "0.1.0"
description = "The official application bootstrapper, installer and development orchestrator for the Sillo framework."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "Chidebele Dunamis", email = "techwithdunamix@gmail.com" },
]
keywords = ["sillo", "scaffolding", "cli", "generator", "orchestrator", "asgi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "pydantic>=2.6,<3.0",
    "jinja2>=3.1.3",
    "tomlkit>=0.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "mypy>=1.15.0",
    "ruff>=0.6.0",
    # The integration suite executes generated projects against the real
    # framework, which is the only way to catch a template that produces valid
    # Python that nonetheless does not work. Skipped when these are absent.
    "sillo-framework",
    "sillo-inertia",
    "aiosqlite>=0.19.0",
]

[tool.uv.sources]
sillo-framework = { path = "../core", editable = true }
sillo-inertia = { path = "../inertia", editable = true }

[project.urls]
Homepage = "https://github.com/sillohq/start"
Repository = "https://github.com/sillohq/start"
Documentation = "https://docs.sillo.build"

[project.scripts]
sillo-start = "sillo_start.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sillo_start"]

[tool.hatch.build.targets.sdist]
include = ["sillo_start", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # Typer expresses defaults as function calls in the signature.
    "B008",
    # `str, Enum` rather than `enum.StrEnum`: these values round-trip through
    # TOML and through Pydantic's `use_enum_values`, both of which treat a
    # str-subclass predictably. The gain from switching is cosmetic and the
    # risk is a silent serialisation change.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
files = ["sillo_start"]

[dependency-groups]
dev = [
    "aerich>=0.9.3",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "tortoise-orm>=1.1.7",
]
